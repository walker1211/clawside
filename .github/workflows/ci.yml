name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Secret scan
        run: scripts/secret-scan.sh

      - name: Secret history scan
        run: scripts/secret-scan.sh --history

      - name: gofmt check
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 ./...