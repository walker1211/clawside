name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Local CI
        run: scripts/ci-local.sh clean

  build:
    name: Build ${{ matrix.suffix }}
    runs-on: ubuntu-latest
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
            ext: ""
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
            ext: ""
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: ".exe"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build release archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          SUFFIX: ${{ matrix.suffix }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          package="clawside-${SUFFIX}"
          mkdir -p "dist/${package}/configs"
          GOOS="${GOOS}" GOARCH="${GOARCH}" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "dist/${package}/clawside${EXT}" .
          cp LICENSE README.md README.zh-CN.md README.en.md .example.env "dist/${package}/"
          cp configs/config.example.toml "dist/${package}/configs/config.example.toml"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: clawside-${{ matrix.suffix }}
          path: dist/clawside-${{ matrix.suffix }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum clawside-*.tar.gz > checksums.txt)

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${TAG_NAME}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release view "${TAG_NAME}" --repo "${GH_REPO}" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              case "$asset" in
                clawside-linux-amd64.tar.gz|clawside-linux-arm64.tar.gz|clawside-darwin-amd64.tar.gz|clawside-darwin-arm64.tar.gz|clawside-windows-amd64.tar.gz|clawside-windows-amd64.zip|checksums.txt)
                  gh release delete-asset "${TAG_NAME}" "$asset" --repo "${GH_REPO}" --yes
                  ;;
              esac
            done
            gh release upload "${TAG_NAME}" dist/* --repo "${GH_REPO}" --clobber
          else
            gh release create "${TAG_NAME}" dist/* --repo "${GH_REPO}" --verify-tag --title "${TAG_NAME}" --generate-notes
          fi
