name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Secret scan
        run: scripts/secret-scan.sh

      - name: Secret history scan
        run: scripts/secret-scan.sh --history

      - name: gofmt check
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 ./...

  build:
    name: Build ${{ matrix.goos }} ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary_name: clawside
            artifact_name: clawside-linux-amd64
            archive_name: clawside-linux-amd64.tar.gz
          - goos: linux
            goarch: arm64
            binary_name: clawside
            artifact_name: clawside-linux-arm64
            archive_name: clawside-linux-arm64.tar.gz
          - goos: darwin
            goarch: amd64
            binary_name: clawside
            artifact_name: clawside-darwin-amd64
            archive_name: clawside-darwin-amd64.tar.gz
          - goos: darwin
            goarch: arm64
            binary_name: clawside
            artifact_name: clawside-darwin-arm64
            archive_name: clawside-darwin-arm64.tar.gz
          - goos: windows
            goarch: amd64
            binary_name: clawside-windows-amd64.exe
            artifact_name: clawside-windows-amd64
            archive_name: clawside-windows-amd64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p "dist/${{ matrix.artifact_name }}"
          go build -trimpath -ldflags "-s -w" -o "dist/${{ matrix.artifact_name }}/${{ matrix.binary_name }}" .

      - name: Copy release files
        run: |
          cp LICENSE "dist/${{ matrix.artifact_name }}/LICENSE"
          cp README.md "dist/${{ matrix.artifact_name }}/README.md"
          cp README.zh-CN.md "dist/${{ matrix.artifact_name }}/README.zh-CN.md"
          cp README.en.md "dist/${{ matrix.artifact_name }}/README.en.md"
          cp .example.env "dist/${{ matrix.artifact_name }}/.example.env"
          mkdir -p "dist/${{ matrix.artifact_name }}/configs"
          cp configs/config.example.toml "dist/${{ matrix.artifact_name }}/configs/config.example.toml"

      - name: Package Unix archive
        if: matrix.goos != 'windows'
        run: |
          cd dist
          tar -czf "${{ matrix.archive_name }}" "${{ matrix.artifact_name }}"

      - name: Package Windows archive
        if: matrix.goos == 'windows'
        run: |
          cd dist
          zip -r "${{ matrix.archive_name }}" "${{ matrix.artifact_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.archive_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > checksums.txt

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
